<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okinawa Tourist Spots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-logo">
            Okinawa
        </div>
        <div class="nav-actions">
            <a href="" class="nav-cta">
                INQUIRY
            </a>
            <button class="menu-btn">
                <span></span>
                <span></span>
            </button>
        </div>
    </header>
    <nav class="mobile-menu">
        <button class="mobile-menu-close">
            &times;
        </button>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#spots">Spots</a></li>
            <li><a href="#info">Seasons</a></li>
            <li><a href="#recommend">Recommend</a></li>
        </ul>
    </nav>
    <main>
        <section id="home" class="hero hero-visual">
            <div class="hero-frame">
                <div class="hero-image-layer"></div>
                <div class="hero-content">
                    <h2 class="hero-kicker">
                        DISCOVER
                    </h2>
                    <p class="hero-title">
                        Okinawa
                    </p>
                    <span class="hero-sub">
                        in Japan
                    </span>
                </div>
            </div>
            <div class="scroll-indicator">
                <span>
                    SCROLL
                </span>
                <span class="scroll-line"></span>
            </div>
        </section>
        <section id="spots" class="spots-section">
            <div class="container">
                <h2 class="section-title">
                    Tourist spots in Okinawa
                </h2>
                <div class="spots-grid scroll-reveal">
                    <article class="spot-card">
                        <div class="spot-image">
                            <img src="https://okinawa-navi.jp/wp-content/uploads/2025/04/pixta_56916777_M.jpg" alt="">
                        </div>
                        <div class="spot-content">
                            <h3>
                                Shuri Castle
                                <span>首里城</span>
                            </h3>
                            <p>
                                A historic Ryukyu castle ruin with 
                                an impressive vermilion main hall.
                            </p>
                            <div class="spot-tags">
                                <span class="tag">History</span>
                                <span class="tag">Culture</span>
                            </div>
                            <button class="more-info-btn" onclick="showSpotInfo('shuri')">
                                See Details
                            </button>
                        </div>
                    </article>
                </div>       
            </div>
        </section>
    </main>
</body>
</html>
